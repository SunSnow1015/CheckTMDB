name: Check TMDB IP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # 每天北京时间 12:00（GitHub cron 按 UTC 执行，4:00 UTC = 12:00 CST）

permissions:
  contents: write

concurrency:
  group: check-tmdb-ip
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python script (带 -G 参数，追加 GitHub hosts)
        shell: bash
        run: |
          set -eo pipefail
          python -u check_tmdb_github_dnschecked.py -G 2>&1 | tee run.log

      - name: 校验 -G 是否取到 GitHub 地址
        if: always()
        run: |
          echo "===== 脚本 GitHub hosts 相关日志 ====="
          grep -E "追加Github ip|获取GitHub hosts|所有Url项目失败|最新TMDB" run.log || echo "(无相关日志)"
          echo
          echo "===== Tmdb_host_ipv4 行数 / GitHub 条目数 ====="
          wc -l < Tmdb_host_ipv4 || echo 0
          grep -Eic "github\.com|githubusercontent\.com" Tmdb_host_ipv4 || echo "0 (未取到)"
          echo "--- 前 15 条 GitHub 条目 ---"
          grep -Ei "github\.com|githubusercontent\.com" Tmdb_host_ipv4 | head -n 15 || echo "(无)"
          echo
          echo "===== Tmdb_host_ipv6 行数 / GitHub 条目数 ====="
          wc -l < Tmdb_host_ipv6 || echo 0
          grep -Eic "github\.com|githubusercontent\.com" Tmdb_host_ipv6 || echo "0 (未取到)"
          echo "--- 前 15 条 GitHub 条目 ---"
          grep -Ei "github\.com|githubusercontent\.com" Tmdb_host_ipv6 | head -n 15 || echo "(无)"
          echo
          echo "===== TMDB 域名条目是否仍在 ====="
          grep -Ec "tmdb\.org|themoviedb\.org|imdb\.com|thetvdb\.com|fanart\.tv|trakt\.tv" Tmdb_host_ipv4 || echo "0"
          echo
          echo "===== 结果判定 ====="
          if grep -q "追加Github ip" run.log 2>/dev/null && grep -Eqi "github\.com|githubusercontent\.com" Tmdb_host_ipv4; then
            echo "::notice::-G 本次实际抓取到 GitHub hosts 并写入 Tmdb_host_ipv4 / Tmdb_host_ipv6"
          elif grep -Eqi "github\.com|githubusercontent\.com" Tmdb_host_ipv4; then
            echo "::notice::本次 TMDB 地址无变化，脚本跳过写入（write_host_file 未触发），文件中的 GitHub 条目沿用上轮结果"
          else
            echo "::warning::-G 未取到 GitHub 条目：4 个 hosts 源在 runner 上全部失败，本次仅更新 TMDB 地址"
          fi
          if grep -q "所有Url项目失败" run.log 2>/dev/null; then
            echo "::warning::get_github_hosts() 全部源失败，请检查 hosts.gitcdn.top 等上游是否变更"
          fi
          if grep -q "Network is unreachable" run.log 2>/dev/null; then
            echo "::warning::runner 无 IPv6 出口，IPv6 地址未经测速，脚本按 DNS 返回的第一个 IP 兜底写入 Tmdb_host_ipv6"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-hosts-run-${{ github.run_number }}
          path: |
            Tmdb_host_ipv4
            Tmdb_host_ipv6
            README.md
            run.log
          if-no-files-found: warn

      - name: Commit changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Tmdb_host_ipv4 Tmdb_host_ipv6
          if git diff --cached --quiet; then
            echo "无变更需要提交"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update TMDB IP [skip ci]"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push origin HEAD:${{ github.ref_name }}

      - name: 同步到 Gitee 备源
        if: ${{ secrets.GITEE_TOKEN != '' }}
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: openclaw-test
          GITEE_REPO: CheckTMDB-sync
          GITEE_BRANCH: master
        run: |
          set -uo pipefail
          api="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/contents"
          auth=(-H "Authorization: Bearer $GITEE_TOKEN")
          for f in Tmdb_host_ipv4 Tmdb_host_ipv6; do
            if [ ! -s "$f" ]; then
              echo "::warning::$f 不存在或为空，跳过 Gitee 同步"
              continue
            fi
            # 先取当前文件 sha：有 sha 走 PUT 更新，没有则 POST 新建（2026-11-02 实测语义）
            sha=$(curl -s "${auth[@]}" -G --data-urlencode "ref=$GITEE_BRANCH" "$api/$f" \
                  | jq -r '.sha // empty')
            body=$(base64 -w0 < "$f")
            if [ -n "$sha" ]; then
              method=PUT
              code=$(curl -s -o gitee_resp.json -w '%{http_code}' -X "$method" "$api/$f" \
                     "${auth[@]}" -d "branch=$GITEE_BRANCH" -d "sha=$sha" \
                     -d "message=sync $f [skip ci]" --data-urlencode "content=$body")
            else
              method=POST
              code=$(curl -s -o gitee_resp.json -w '%{http_code}' -X "$method" "$api/$f" \
                     "${auth[@]}" -d "branch=$GITEE_BRANCH" \
                     -d "message=init $f [skip ci]" --data-urlencode "content=$body")
            fi
            echo "$f: $method -> HTTP $code"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::warning::Gitee 同步 $f 失败 (HTTP $code): $(head -c 200 gitee_resp.json | tr -d '\r\n')"
              continue
            fi
            # 回读校验：确认 Gitee 上的字节与本地一致
            got=$(curl -s "${auth[@]}" -G --data-urlencode "ref=$GITEE_BRANCH" "$api/$f" \
                  | jq -r '.content // empty' | tr -d '\n' | base64 -d 2>/dev/null | sha256sum | cut -d' ' -f1)
            want=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$got" = "$want" ]; then
              echo "Gitee 回读校验一致: $f"
            else
              echo "::warning::Gitee 回读校验不一致: $f (gitee=$got local=$want)"
            fi
          done
