name: Check TMDB IP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # 每天北京时间 12:00（GitHub cron 按 UTC 执行，4:00 UTC = 12:00 CST）

permissions:
  contents: write

concurrency:
  group: check-tmdb-ip
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 提到 job 级是为了给下面的同步步骤做 if 判断：step 级 if 不允许直接引用 secrets 上下文
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: openclaw-test
      GITEE_REPO: CheckTMDB-sync
      GITEE_BRANCH: master

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python script (带 -G 参数，追加 GitHub hosts)
        shell: bash
        run: |
          set -eo pipefail
          python -u check_tmdb_github_dnschecked.py -G 2>&1 | tee run.log

      - name: 校验 -G 是否取到 GitHub 地址
        if: always()
        run: |
          echo "===== 脚本 GitHub hosts 相关日志 ====="
          grep -E "追加Github ip|获取GitHub hosts|所有Url项目失败|最新TMDB" run.log || echo "(无相关日志)"
          echo
          echo "===== Tmdb_host_ipv4 行数 / GitHub 条目数 ====="
          wc -l < Tmdb_host_ipv4 || echo 0
          grep -Eic "github\.com|githubusercontent\.com" Tmdb_host_ipv4 || echo "0 (未取到)"
          echo "--- 前 15 条 GitHub 条目 ---"
          grep -Ei "github\.com|githubusercontent\.com" Tmdb_host_ipv4 | head -n 15 || echo "(无)"
          echo
          echo "===== Tmdb_host_ipv6 行数 / GitHub 条目数 ====="
          wc -l < Tmdb_host_ipv6 || echo 0
          grep -Eic "github\.com|githubusercontent\.com" Tmdb_host_ipv6 || echo "0 (未取到)"
          echo "--- 前 15 条 GitHub 条目 ---"
          grep -Ei "github\.com|githubusercontent\.com" Tmdb_host_ipv6 | head -n 15 || echo "(无)"
          echo
          echo "===== TMDB 域名条目是否仍在 ====="
          grep -Ec "tmdb\.org|themoviedb\.org|imdb\.com|thetvdb\.com|fanart\.tv|trakt\.tv" Tmdb_host_ipv4 || echo "0"
          echo
          echo "===== 结果判定 ====="
          if grep -q "追加Github ip" run.log 2>/dev/null && grep -Eqi "github\.com|githubusercontent\.com" Tmdb_host_ipv4; then
            echo "::notice::-G 本次实际抓取到 GitHub hosts 并写入 Tmdb_host_ipv4 / Tmdb_host_ipv6"
          elif grep -Eqi "github\.com|githubusercontent\.com" Tmdb_host_ipv4; then
            echo "::notice::本次 TMDB 地址无变化，脚本跳过写入（write_host_file 未触发），文件中的 GitHub 条目沿用上轮结果"
          else
            echo "::warning::-G 未取到 GitHub 条目：4 个 hosts 源在 runner 上全部失败，本次仅更新 TMDB 地址"
          fi
          if grep -q "所有Url项目失败" run.log 2>/dev/null; then
            echo "::warning::get_github_hosts() 全部源失败，请检查 hosts.gitcdn.top 等上游是否变更"
          fi
          if grep -q "Network is unreachable" run.log 2>/dev/null; then
            echo "::warning::runner 无 IPv6 出口，IPv6 地址未经测速，脚本按 DNS 返回的第一个 IP 兜底写入 Tmdb_host_ipv6"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-hosts-run-${{ github.run_number }}
          path: |
            Tmdb_host_ipv4
            Tmdb_host_ipv6
            README.md
            run.log
          if-no-files-found: warn

      - name: Commit changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Tmdb_host_ipv4 Tmdb_host_ipv6
          if git diff --cached --quiet; then
            echo "无变更需要提交"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update TMDB IP [skip ci]"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push origin HEAD:${{ github.ref_name }}

      - name: 同步到 Gitee 备源
        if: env.GITEE_TOKEN != ''
        continue-on-error: true
        run: |
          set -uo pipefail
          api="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/contents"
          auth=(-H "Authorization: Bearer $GITEE_TOKEN")
          # 2026-11-02 实测：runner 到 gitee.com 的 TLS 链路偶发 handshake 失败（curl exit 35），
          # 而 Actions 的 run 是用 /usr/bin/bash -e 起的，任何一条未被吃掉的 curl 失败都会中断整个 for 循环，
          # 结果是排在后面的 Tmdb_host_ipv6 直接不同步，而 continue-on-error 又把这一步显示成 success。
          # 所以：每条 curl 都要带超时+重试，并且都要能吃掉失败，绝不靠脚本中断来暴露问题。
          gt=(--connect-timeout 10 --max-time 30 --retry 2 --retry-delay 5 --retry-all-errors --retry-connrefused)
          ok=0
          bad=""
          for f in Tmdb_host_ipv4 Tmdb_host_ipv6; do
            if [ ! -s "$f" ]; then
              echo "::warning::$f 不存在或为空，跳过 Gitee 同步"
              bad="$bad ${f}(缺失)"
              continue
            fi
            # 先取当前文件 sha：有 sha 走 PUT 更新，没有则 POST 新建（2026-11-02 实测语义）
            # 注意：路径不存在时 Gitee 返回的是数组（目录列表形态），jq 必须先判类型再取 sha
            meta=$(curl "${gt[@]}" -s "${auth[@]}" -G --data-urlencode "ref=$GITEE_BRANCH" "$api/$f" 2>/dev/null || true)
            sha=$(printf '%s' "$meta" | jq -r 'select(type=="object") | .sha // empty' 2>/dev/null || true)
            body=$(base64 -w0 < "$f")
            cerr=0
            if [ -n "$sha" ]; then
              method=PUT
              code=$(curl "${gt[@]}" -s -o gitee_resp.json -w '%{http_code}' -X "$method" "$api/$f" \
                     "${auth[@]}" -d "branch=$GITEE_BRANCH" -d "sha=$sha" \
                     -d "message=sync $f [skip ci]" --data-urlencode "content=$body") || cerr=$?
            else
              method=POST
              code=$(curl "${gt[@]}" -s -o gitee_resp.json -w '%{http_code}' -X "$method" "$api/$f" \
                     "${auth[@]}" -d "branch=$GITEE_BRANCH" \
                     -d "message=init $f [skip ci]" --data-urlencode "content=$body") || cerr=$?
            fi
            echo "$f: $method -> HTTP $code (curl_exit=$cerr)"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::warning::Gitee 写入 $f 失败 (HTTP $code, curl_exit=$cerr): $(head -c 200 gitee_resp.json 2>/dev/null | tr -d '\r\n')"
              bad="$bad ${f}(写入$code/$cerr)"
              continue
            fi
            # 回读校验：先把响应单独取回再解析，解析失败也不会连累脚本
            rb=$(curl "${gt[@]}" -s "${auth[@]}" -G --data-urlencode "ref=$GITEE_BRANCH" "$api/$f" 2>/dev/null || true)
            got=$(printf '%s' "$rb" | jq -r '.content // empty' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null | sha256sum | cut -d' ' -f1 || true)
            want=$(sha256sum "$f" | cut -d' ' -f1)
            if [ -n "$got" ] && [ "$got" = "$want" ]; then
              echo "Gitee 回读校验一致: $f ($got)"
              ok=$((ok+1))
            else
              echo "::warning::Gitee 回读校验不一致: $f (gitee=${got:-取回失败} local=$want)"
              bad="$bad ${f}(回读)"
            fi
          done
          # 小结一定要打印出来：continue-on-error 让这步永远显示 success，只有这里的计数和 annotation 能证明它真的同步了
          echo "===== Gitee 同步小结 ====="
          echo "写入成功且回读逐字节一致: $ok/2"
          if [ -n "$bad" ]; then
            echo "::warning::Gitee 备源本次未全部同步:$bad（GitHub 主链路不受影响；NAS 只消费 Tmdb_host_ipv4，且拉取校验失败时会继续沿用上一份 hosts）"
          else
            echo "Gitee 备源两个文件均已同步并通过 sha256 回读校验"
          fi
